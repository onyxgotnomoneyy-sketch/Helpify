name: Build Helpify iOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS .geode
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: iOS
          combine: false

      - name: Upload iOS .geode
        uses: actions/upload-artifact@v4
        with:
          name: Helpify-iOS
          path: build/*.geode
          
